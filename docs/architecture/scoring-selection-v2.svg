<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1536" viewBox="0 0 1120 1536" role="img" aria-labelledby="title desc">
<title id="title">用户操作与双轮评估</title><desc id="desc">先定义成功，再探索偏离最短路径的操作；最终用执行结果验证。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#84958e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif} .title{font-size:36px;font-weight:650;letter-spacing:-.7px} .label{font-size:20px;letter-spacing:1px;font-weight:600} .heading{font-size:26px;font-weight:600} .body{font-size:22px} .small{font-size:20px} .mono{font-family:"SFMono-Regular",Consolas,monospace;font-size:20px}</style>
<rect x="0" y="0" width="1120" height="1536" rx="0" fill="#f5f7f2"/>
<rect x="48" y="40" width="8" height="40" rx="4" fill="#178068"/>
<text x="76" y="70" class="title" fill="#18372e">askJEV / 用户操作与双轮评估</text>
<text x="48" y="112" class="small" fill="#617168">先定义成功，再探索偏离最短路径的操作；最终用执行结果验证。</text>
<text x="1038" y="70" class="label" fill="#9aaa9e">02</text>
<rect x="48" y="1470" width="1024" height="1" rx="0" fill="#d5dfd5"/>
<text x="48" y="1506" class="small" fill="#617168">目标设计  /  虚线模块待实现；当前仍为 task.json + 单轮评分</text>
<rect x="48" y="150" width="1024" height="130" rx="16" fill="#fffaf0" stroke="#d8ba7c" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="72" y="179" class="small" fill="#b18c40">INPUT / 输入</text>
<text x="72" y="215" class="heading" fill="#18372e">批准的代码或本地页面 + 需求</text>
<text x="72" y="249" class="body" fill="#607168">代码切片 · 页面结构 · 初始状态 · 任务范围</text>
<path d="M560 280 V318" fill="none" stroke="#84958e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="48" y="328" width="1024" height="142" rx="16" fill="#fffaf0" stroke="#d8ba7c" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="72" y="357" class="small" fill="#b18c40">01 / 对话层补齐缺失信息</text>
<text x="72" y="393" class="heading" fill="#18372e">最少做什么算成功？最多需要支持到哪里？</text>
<text x="72" y="427" class="body" fill="#607168">明确用户目标、成功结果、业务范围与本轮探索预算</text>
<path d="M300 470 V510" fill="none" stroke="#84958e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<path d="M820 470 V510" fill="none" stroke="#84958e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="48" y="520" width="488" height="160" rx="16" fill="#fffaf0" stroke="#d8ba7c" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="72" y="549" class="small" fill="#b18c40">02 / 测试起点</text>
<text x="72" y="585" class="heading" fill="#18372e">最短成功路径</text>
<text x="72" y="619" class="body" fill="#607168">从约定初始状态出发</text>
<text x="72" y="649" class="body" fill="#607168">基线先执行，核对可见结果</text>
<rect x="584" y="520" width="488" height="160" rx="16" fill="#fffaf0" stroke="#d8ba7c" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="608" y="549" class="small" fill="#b18c40">03 / 围绕基线扩展</text>
<text x="608" y="585" class="heading" fill="#18372e">少见但可能的操作</text>
<text x="608" y="619" class="body" fill="#607168">省略 · 重复 · 撤回 · 顺序变化</text>
<text x="608" y="649" class="body" fill="#607168">边界值与状态组合；步数有上限</text>
<path d="M536 600 H576" fill="none" stroke="#84958e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<path d="M300 680 V716 H820 V680" fill="none" stroke="#84958e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<path d="M560 716 V744" fill="none" stroke="#84958e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="48" y="754" width="1024" height="74" rx="14" fill="#e3efe5" stroke="#c6d5c8" stroke-width="1.5"/>
<text x="72" y="800" class="heading" fill="#18372e">冻结同一份源码、需求、候选路径与预期，附上必要证据</text>
<path d="M560 828 V862 H300 V884" fill="none" stroke="#84958e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<path d="M560 862 H820 V884" fill="none" stroke="#84958e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="48" y="894" width="488" height="162" rx="16" fill="#fffaf0" stroke="#d8ba7c" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="72" y="923" class="small" fill="#b18c40">04A / 第一轮</text>
<text x="72" y="959" class="heading" fill="#18372e">需求核对</text>
<text x="72" y="993" class="body" fill="#607168">沿路径逐步验证需求是否满足</text>
<text x="72" y="1023" class="body" fill="#607168">保存原始分布、版本和耗时</text>
<rect x="584" y="894" width="488" height="162" rx="16" fill="#fffaf0" stroke="#d8ba7c" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="608" y="923" class="small" fill="#b18c40">04B / 第二轮</text>
<text x="608" y="959" class="heading" fill="#18372e">反例检查</text>
<text x="608" y="993" class="body" fill="#607168">同一证据；不看首轮分数和结论</text>
<text x="608" y="1023" class="body" fill="#607168">检查边界、状态残留与遗漏条件</text>
<path d="M300 1056 V1092 H820 V1056" fill="none" stroke="#84958e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
<path d="M560 1092 V1120" fill="none" stroke="#84958e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="48" y="1130" width="1024" height="132" rx="16" fill="#fffaf0" stroke="#d8ba7c" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="72" y="1159" class="small" fill="#b18c40">05 / 解释与安排</text>
<text x="72" y="1195" class="heading" fill="#18372e">记录一致、分歧与未知；关键路径不因高分免测</text>
<text x="72" y="1229" class="body" fill="#607168">按覆盖、边界和预算安排；同错不当作可靠，不平均掩盖分歧</text>
<path d="M560 1262 V1300" fill="none" stroke="#84958e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="1310" width="1024" height="140" rx="16" fill="#173b31"/>
<text x="72" y="1345" class="small" fill="#c2d8ca">06 / 复用现有执行与回归，补上独立复核设计</text>
<text x="72" y="1384" class="heading" fill="#ffffff">实际测试 → 失败证据 → 复现与复核 → 修复后原测试</text>
<text x="72" y="1420" class="body" fill="#c2d8ca">再用保留样本评估双轮是否带来检出收益与时间收益</text>
</svg>