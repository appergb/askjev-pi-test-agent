name: Quality checks

on:
  pull_request:
  push:
    branches: [main, 'Beta/**']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agent and terminal (Node ${{ matrix.node }})
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '26.8.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run package:skill
      - run: npm audit --omit=dev

  proxy:
    name: API proxy (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: deploy/spark/requirements-test.txt
      - run: python -m pip install -r deploy/spark/requirements-test.txt
      - run: python -m pytest -q deploy/spark/test_public_api_proxy.py --cov=public_api_proxy --cov-report=term-missing --cov-fail-under=90
      - run: python -m mypy --strict deploy/spark/public_api_proxy.py
      - run: python -m ruff check deploy/spark/public_api_proxy.py deploy/spark/test_public_api_proxy.py
      - run: python -m black --check deploy/spark/public_api_proxy.py deploy/spark/test_public_api_proxy.py
