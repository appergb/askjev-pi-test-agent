<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>Northstar 商店 · 结算</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><span>NORTHSTAR / FIELD GOODS</span><b>购物袋 · 01</b></header><h1>为下一次出发做好准备。</h1><p class="intro">轻装系列 · 旅行收纳袋</p><section><article><div class="product">FIELD<br>POUCH</div><h2>轻量旅行收纳袋</h2><p>防泼水面料 / 石墨灰</p><strong>单价 ¥20.00</strong></article><form id="checkout"><h2>订单结算</h2><label>数量<input id="quantity" type="number" min="1" max="20" value="1"></label><label>配送方式<select id="delivery"><option value="ship">送货上门</option><option value="pickup">到店自提</option></select></label><label>优惠码<input id="coupon" placeholder="输入优惠码"></label><button id="recalculate" type="button">更新订单</button><p id="error" role="status"></p><dl><dt>商品金额</dt><dd id="subtotal">20.00</dd><dt>优惠金额</dt><dd id="discount">0.00</dd><dt>运费</dt><dd id="shipping">5.00</dd><dt class="total">应付合计</dt><dd class="total" id="total">25.00</dd></dl><p class="note">商品金额满 ¥100 包邮 · SAVE10 享九折</p></form></section><footer>本地测试商店 · 无支付与订单提交</footer></main><script src="app.js"></script></body></html>
